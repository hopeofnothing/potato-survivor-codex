<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Potato Survivor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="game-frame" aria-label="Potato Survivor game">
        <canvas id="game" width="1280" height="720"></canvas>

        <div class="hud">
          <div class="hud-row">
            <div class="stat">
              <span data-i18n="hudLevel">Level</span>
              <strong id="level">1</strong>
            </div>
            <div class="stat">
              <span data-i18n="hudTime">Time</span>
              <strong id="time">00:00</strong>
            </div>
            <div class="stat">
              <span data-i18n="hudKos">KOs</span>
              <strong id="kills">0</strong>
            </div>
            <button id="pauseButton" class="icon-button" type="button" aria-label="Pause game" title="Pause">
              Esc
            </button>
            <button id="audioButton" class="icon-button audio-button" type="button" aria-label="Toggle sound" title="Sound on">
              Snd
            </button>
          </div>

          <div class="bars">
            <div class="meter health">
              <span id="healthBar"></span>
            </div>
            <div class="meter xp">
              <span id="xpBar"></span>
            </div>
          </div>

          <div class="loadout">
            <div>
              <span class="loadout-label" data-i18n="weapons">Weapons</span>
              <div id="weaponSlots" class="slots"></div>
            </div>
            <div>
              <span class="loadout-label" data-i18n="accessories">Accessories</span>
              <div id="accessorySlots" class="slots"></div>
            </div>
          </div>
        </div>

        <div id="startOverlay" class="overlay active">
          <div class="panel title-panel">
            <div class="potato-mark" aria-hidden="true"></div>
            <h1 data-i18n="title">Potato Survivor</h1>
            <p data-i18n="tagline">Hold the field, harvest XP, and turn one brave potato into a fully loaded fryer storm.</p>
            <div class="language-toggle" aria-label="Language">
              <button class="lang-button active" type="button" data-lang="en">EN</button>
              <button class="lang-button" type="button" data-lang="zh">繁中</button>
            </div>
            <button id="startButton" class="primary-button" type="button" data-i18n="startRun">Start Run</button>
          </div>
        </div>

        <div id="levelOverlay" class="overlay">
          <div class="panel level-panel">
            <h2 data-i18n="levelUp">Level Up</h2>
            <div id="choices" class="choices"></div>
          </div>
        </div>

        <div id="pauseOverlay" class="overlay">
          <div class="panel pause-panel">
            <div class="pause-head">
              <h2 data-i18n="paused">Paused</h2>
              <div class="pause-actions">
                <div class="language-toggle" aria-label="Language">
                  <button class="lang-button active" type="button" data-lang="en">EN</button>
                  <button class="lang-button" type="button" data-lang="zh">繁中</button>
                </div>
                <button id="resumeButton" class="primary-button compact" type="button" data-i18n="resume">Resume</button>
              </div>
            </div>
            <div class="pause-grid">
              <section>
                <h3 data-i18n="weapons">Weapons</h3>
                <div id="pauseWeapons" class="details-list"></div>
              </section>
              <section>
                <h3 data-i18n="accessories">Accessories</h3>
                <div id="pauseAccessories" class="details-list"></div>
              </section>
            </div>
          </div>
        </div>

        <div id="gameOverOverlay" class="overlay">
          <div class="panel title-panel">
            <h2 data-i18n="mashed">Mashed</h2>
            <p id="finalStats"></p>
            <div class="button-row">
              <button id="restartButton" class="primary-button" type="button" data-i18n="tryAgain">Try Again</button>
              <button id="backToStartButton" class="primary-button secondary" type="button" data-i18n="backToStart">Back to Start</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>

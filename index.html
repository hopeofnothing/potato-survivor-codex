<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Potato Survivor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="game-frame" aria-label="Potato Survivor game">
        <canvas id="game" width="1280" height="720"></canvas>

        <div class="hud">
          <div class="hud-row">
            <div class="stat">
              <span>Level</span>
              <strong id="level">1</strong>
            </div>
            <div class="stat">
              <span>Time</span>
              <strong id="time">00:00</strong>
            </div>
            <div class="stat">
              <span>KOs</span>
              <strong id="kills">0</strong>
            </div>
            <button id="pauseButton" class="icon-button" type="button" aria-label="Pause game" title="Pause">
              Esc
            </button>
          </div>

          <div class="bars">
            <div class="meter health">
              <span id="healthBar"></span>
            </div>
            <div class="meter xp">
              <span id="xpBar"></span>
            </div>
          </div>

          <div class="loadout">
            <div>
              <span class="loadout-label">Weapons</span>
              <div id="weaponSlots" class="slots"></div>
            </div>
            <div>
              <span class="loadout-label">Accessories</span>
              <div id="accessorySlots" class="slots"></div>
            </div>
          </div>
        </div>

        <div id="startOverlay" class="overlay active">
          <div class="panel title-panel">
            <div class="potato-mark" aria-hidden="true"></div>
            <h1>Potato Survivor</h1>
            <p>Hold the field, harvest XP, and turn one brave potato into a fully loaded fryer storm.</p>
            <button id="startButton" class="primary-button" type="button">Start Run</button>
          </div>
        </div>

        <div id="levelOverlay" class="overlay">
          <div class="panel level-panel">
            <h2>Level Up</h2>
            <div id="choices" class="choices"></div>
          </div>
        </div>

        <div id="pauseOverlay" class="overlay">
          <div class="panel pause-panel">
            <div class="pause-head">
              <h2>Paused</h2>
              <button id="resumeButton" class="primary-button compact" type="button">Resume</button>
            </div>
            <div class="pause-grid">
              <section>
                <h3>Weapons</h3>
                <div id="pauseWeapons" class="details-list"></div>
              </section>
              <section>
                <h3>Accessories</h3>
                <div id="pauseAccessories" class="details-list"></div>
              </section>
            </div>
          </div>
        </div>

        <div id="gameOverOverlay" class="overlay">
          <div class="panel title-panel">
            <h2>Mashed</h2>
            <p id="finalStats"></p>
            <div class="button-row">
              <button id="restartButton" class="primary-button" type="button">Try Again</button>
              <button id="backToStartButton" class="primary-button secondary" type="button">Back to Start</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
